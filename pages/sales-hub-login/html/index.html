<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Sales Hub | Mizuho America</title>
    <meta name="description" content="Sales Hub rep portal login for registered Mizuho America sales representatives.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Freeman:wght@400&family=Open+Sans:wght@300;400;600;700&family=Mukta:wght@700&family=Montserrat:wght@300;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <section class="rs lg" id="sales-hub-login">
            <div class="fx">
                <div class="lg-card"><img class="lg-logo" src="figma/images/logo-mizuho-header-srgb.png" alt="Mizuho America" width="200" height="61">
                    <h1 class="lg-h1">Sales HUb - REP Portal</h1>
                    <form class="lg-form" action="../../sales-hub-dashboard/html/" method="get"><label class="lg-label" for="lg-email">Email address</label><input class="lg-in" id="lg-email" type="email" name="log" placeholder="rep_name@example.com" autocomplete="username" required><label class="lg-label" for="lg-pass">Password</label><input class="lg-in" id="lg-pass" type="password" name="pwd" placeholder="************" autocomplete="current-password" required><button class="lg-go" type="submit">Log in to Sales Hub</button></form><a class="lg-forgot" href="http://task-11.local/wp-login.php?action=lostpassword">Forgot your password?</a>
                    <hr class="lg-rule">
                    <p class="lg-note">Sales Hub access is for registered Mizuho America sales representatives only.<br>To request access, contact your account manager.</p>
                </div>
            </div>
        </section>
    </main>
    <footer class="site-foot portal-foot rs" id="site-footer">
        <div class="fx"><img class="pf-logo" src="figma/images/logo-mizuho-footer-reversed.png" alt="Mizuho America" width="200" height="58" loading="lazy">
            <p class="pf-copy"><a href="http://task-11.local/sales-hub/">Sales Hub</a><span class="pf-dot" aria-hidden="true">•</span>© 2026 Mizuho America, Inc. All rights reserved.</p>
            <nav class="pf-legal" aria-label="Legal">
                <ul>
                    <li><a href="#privacy-policy">Privacy Policy</a></li>
                    <li><a href="#terms-of-use">Terms of Use</a></li>
                </ul>
            </nav>
        </div>
    </footer>
</body>

</html>
